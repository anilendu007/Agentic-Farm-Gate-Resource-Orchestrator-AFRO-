<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AFRO Stack — Agentic Farm-Gate Resource Orchestrator</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
/* ═══════════════════════════════════════════════════
   AFRO STACK — Design System
   ═══════════════════════════════════════════════════ */
:root {
  --forest:    #1a2e1a;
  --green-dk:  #2d4a2d;
  --green-md:  #3d6b3d;
  --green-lt:  #5a8f5a;
  --green-muted: #7aad7a;
  --cream:     #f5f0e8;
  --off-white: #ede8dc;
  --charcoal:  #2c2c2c;
  --slate:     #4a4a4a;
  --muted:     #6b6b6b;
  --border:    #c8c0b0;
  --border-lt: #ddd6c8;
  --amber:     #c4841a;
  --amber-lt:  #f0a832;
  --amber-bg:  #fdf3e0;
  --red:       #b03030;
  --red-lt:    #e05050;
  --red-bg:    #fde8e8;
  --blue:      #2a6090;
  --blue-lt:   #4a90d0;
  --blue-bg:   #e8f2fa;
  --white:     #ffffff;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.10);
  --shadow-md: 0 3px 10px rgba(0,0,0,0.12);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.14);
  --radius:    4px;
  --radius-md: 6px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 14px; }

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--cream);
  color: var(--charcoal);
  min-height: 100vh;
  line-height: 1.5;
}

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--off-white); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ══ LAYOUT ══════════════════════════════════════════ */
.app-shell { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

/* ── HEADER ── */
.app-header {
  background: var(--forest);
  color: var(--cream);
  padding: 0 24px;
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  border-bottom: 2px solid var(--green-dk);
  z-index: 100;
}
.header-brand { display: flex; align-items: baseline; gap: 10px; }
.header-logo {
  font-size: 1.25rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--green-muted);
  text-transform: uppercase;
}
.header-tagline {
  font-size: 0.72rem;
  color: rgba(255,255,255,0.45);
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.header-right { display: flex; align-items: center; gap: 20px; }
.system-status { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; }
.status-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #4caf50;
  box-shadow: 0 0 6px rgba(76,175,80,0.7);
  flex-shrink: 0;
}
.status-dot.offline { background: var(--red-lt); box-shadow: 0 0 6px rgba(224,80,80,0.7); }
.status-dot.warning { background: var(--amber-lt); box-shadow: 0 0 6px rgba(240,168,50,0.7); }
.status-label { color: rgba(255,255,255,0.7); letter-spacing: 0.05em; text-transform: uppercase; }
.header-connectivity { display: flex; gap: 12px; }
.conn-badge {
  font-size: 0.65rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 2px;
  font-weight: 600;
  border: 1px solid;
}
.conn-badge.online  { color: #6ed86e; border-color: #4caf5060; background: rgba(76,175,80,0.12); }
.conn-badge.offline { color: var(--red-lt); border-color: rgba(224,80,80,0.4); background: rgba(224,80,80,0.1); }
.conn-badge.active  { color: var(--amber-lt); border-color: rgba(240,168,50,0.4); background: rgba(240,168,50,0.1); }

/* ── BODY LAYOUT ── */
.app-body { display: flex; flex: 1; overflow: hidden; }

/* ── SIDEBAR NAV ── */
.sidebar {
  width: 200px;
  background: var(--green-dk);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  border-right: 1px solid rgba(255,255,255,0.06);
}
.sidebar-section-label {
  font-size: 0.62rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.3);
  padding: 16px 16px 6px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  cursor: pointer;
  border: none;
  background: transparent;
  color: rgba(255,255,255,0.65);
  font-size: 0.82rem;
  text-align: left;
  width: 100%;
  border-left: 3px solid transparent;
  transition: all 0.15s;
  font-family: inherit;
}
.nav-item:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.9); }
.nav-item.active {
  background: rgba(255,255,255,0.1);
  color: #ffffff;
  border-left-color: var(--green-muted);
  font-weight: 600;
}
.nav-icon { font-size: 1rem; width: 20px; text-align: center; flex-shrink: 0; }
.nav-badge {
  margin-left: auto;
  background: var(--amber);
  color: white;
  font-size: 0.6rem;
  padding: 1px 5px;
  border-radius: 10px;
  font-weight: 700;
}
.sidebar-divider { border: none; border-top: 1px solid rgba(255,255,255,0.08); margin: 8px 0; }
.sidebar-footer {
  margin-top: auto;
  padding: 12px 16px;
  font-size: 0.65rem;
  color: rgba(255,255,255,0.25);
  border-top: 1px solid rgba(255,255,255,0.06);
  letter-spacing: 0.05em;
}

/* ── MAIN CONTENT ── */
.main-content { flex: 1; overflow-y: auto; background: var(--cream); }
.page { padding: 24px; max-width: 1100px; }

/* ── OFFLINE BANNER ── */
.offline-banner {
  background: var(--red-bg);
  border-bottom: 2px solid var(--red);
  padding: 10px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 0.82rem;
  color: var(--red);
}
.offline-banner-icon { font-size: 1.1rem; }
.offline-banner strong { font-weight: 700; }
.offline-banner-detail { margin-left: auto; color: var(--muted); font-size: 0.75rem; }

/* ══ TYPOGRAPHY ══════════════════════════════════════ */
.page-title { font-size: 1.3rem; font-weight: 700; color: var(--forest); letter-spacing: -0.01em; }
.page-subtitle { font-size: 0.8rem; color: var(--muted); margin-top: 2px; letter-spacing: 0.02em; }
.section-title { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--slate); margin-bottom: 12px; }
.label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.value-lg { font-size: 1.6rem; font-weight: 700; color: var(--charcoal); line-height: 1.1; }
.value-md { font-size: 1.1rem; font-weight: 700; color: var(--charcoal); }
.value-sm { font-size: 0.82rem; font-weight: 600; color: var(--charcoal); }

/* ══ CARDS ═══════════════════════════════════════════ */
.card {
  background: var(--white);
  border: 1px solid var(--border-lt);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm);
}
.card-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-lt);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.card-body { padding: 16px; }
.card-footer {
  padding: 10px 16px;
  border-top: 1px solid var(--border-lt);
  font-size: 0.72rem;
  color: var(--muted);
}

/* ══ METRIC CARDS ════════════════════════════════════ */
.metrics-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.metric-card {
  background: var(--white);
  border: 1px solid var(--border-lt);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  box-shadow: var(--shadow-sm);
}
.metric-card.warning { border-left: 3px solid var(--amber); }
.metric-card.critical { border-left: 3px solid var(--red); }
.metric-card.active  { border-left: 3px solid var(--green-lt); }
.metric-card.info    { border-left: 3px solid var(--blue-lt); }
.metric-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 6px; }
.metric-value { font-size: 1.5rem; font-weight: 700; color: var(--charcoal); line-height: 1; }
.metric-value.green  { color: var(--green-md); }
.metric-value.amber  { color: var(--amber); }
.metric-value.red    { color: var(--red); }
.metric-value.blue   { color: var(--blue); }
.metric-sub { font-size: 0.7rem; color: var(--muted); margin-top: 4px; }

/* ══ BADGES & TAGS ═══════════════════════════════════ */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 0.65rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 2px 7px;
  border-radius: 2px;
}
.badge.green  { background: #e8f5e8; color: var(--green-md); border: 1px solid #c0dcc0; }
.badge.amber  { background: var(--amber-bg); color: var(--amber); border: 1px solid #f0d090; }
.badge.red    { background: var(--red-bg); color: var(--red); border: 1px solid #f0c0c0; }
.badge.blue   { background: var(--blue-bg); color: var(--blue); border: 1px solid #c0d8f0; }
.badge.grey   { background: #f0f0f0; color: var(--slate); border: 1px solid #d8d8d8; }
.badge.white  { background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.85); border: 1px solid rgba(255,255,255,0.25); }

.sim-tag {
  font-size: 0.6rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--blue);
  background: var(--blue-bg);
  border: 1px solid #c0d8f0;
  padding: 1px 5px;
  border-radius: 2px;
  vertical-align: middle;
  margin-left: 6px;
}

/* ══ BUTTONS ════════════════════════════════════════ */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: var(--radius);
  font-size: 0.78rem;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
  font-family: inherit;
  letter-spacing: 0.02em;
  transition: all 0.15s;
  white-space: nowrap;
}
.btn:hover { opacity: 0.88; transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.btn-primary   { background: var(--green-md); color: white; border-color: var(--green-dk); }
.btn-secondary { background: var(--white); color: var(--slate); border-color: var(--border); }
.btn-warning   { background: var(--amber); color: white; border-color: #a06010; }
.btn-danger    { background: var(--red); color: white; border-color: #882020; }
.btn-info      { background: var(--blue); color: white; border-color: #1a4870; }
.btn-ghost     { background: transparent; color: var(--green-md); border-color: var(--green-md); }
.btn-sm { padding: 5px 10px; font-size: 0.72rem; }
.btn-xs { padding: 3px 8px; font-size: 0.67rem; }

/* ══ GRID HELPERS ════════════════════════════════════ */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.grid-auto { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
.flex-row { display: flex; align-items: center; gap: 12px; }
.flex-between { display: flex; align-items: center; justify-content: space-between; }
.flex-col { display: flex; flex-direction: column; gap: 8px; }
.gap-4  { gap: 4px; }
.gap-8  { gap: 8px; }
.gap-16 { gap: 16px; }
.mb-4  { margin-bottom: 4px; }
.mb-8  { margin-bottom: 8px; }
.mb-12 { margin-bottom: 12px; }
.mb-16 { margin-bottom: 16px; }
.mb-20 { margin-bottom: 20px; }
.mb-24 { margin-bottom: 24px; }
.mt-8  { margin-top: 8px; }
.mt-12 { margin-top: 12px; }
.mt-16 { margin-top: 16px; }

/* ══ FIELD MAP ═══════════════════════════════════════ */
.field-map-container {
  background: #1e3320;
  border-radius: var(--radius-md);
  padding: 16px;
  border: 1px solid #2a4a2a;
  position: relative;
  min-height: 180px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.field-map-title {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: rgba(255,255,255,0.35);
  margin-bottom: 4px;
}
.field-map-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; flex: 1; }
.field-zone {
  border-radius: var(--radius);
  padding: 10px 12px;
  cursor: default;
  border: 1px solid;
  transition: all 0.2s;
  position: relative;
  min-height: 70px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.field-zone.healthy  { background: rgba(74,143,74,0.25); border-color: rgba(74,143,74,0.5); }
.field-zone.warning  { background: rgba(196,132,26,0.25); border-color: rgba(196,132,26,0.5); }
.field-zone.active   { background: rgba(42,96,144,0.25); border-color: rgba(42,96,144,0.5); }
.field-zone.stress   { background: rgba(176,48,48,0.2); border-color: rgba(176,48,48,0.45); }
.field-name { font-size: 0.72rem; font-weight: 700; color: rgba(255,255,255,0.85); text-transform: uppercase; letter-spacing: 0.06em; }
.field-status-text { font-size: 0.65rem; color: rgba(255,255,255,0.55); }
.field-moisture-bar {
  height: 3px;
  background: rgba(255,255,255,0.1);
  border-radius: 2px;
  margin-top: 6px;
  overflow: hidden;
}
.field-moisture-fill {
  height: 100%;
  border-radius: 2px;
  background: var(--green-muted);
  transition: width 0.5s ease;
}
.field-moisture-fill.low { background: var(--amber-lt); }
.field-moisture-fill.critical { background: var(--red-lt); }

/* ══ WATER LEVEL VIZ ═════════════════════════════════ */
.water-level-viz {
  background: #0f2030;
  border-radius: var(--radius-md);
  height: 160px;
  position: relative;
  overflow: hidden;
  border: 1px solid #1a3a50;
}
.water-fill {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: linear-gradient(to top, #1a5f8a, #2d90c0);
  transition: height 0.6s ease;
  opacity: 0.85;
}
.water-surface {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: rgba(120,200,255,0.6);
}
.water-label-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
}
.water-level-value { font-size: 1.4rem; font-weight: 700; color: white; text-shadow: 0 1px 4px rgba(0,0,0,0.5); }
.water-level-unit  { font-size: 0.65rem; color: rgba(255,255,255,0.6); text-transform: uppercase; letter-spacing: 0.1em; }
.water-threshold-line {
  position: absolute;
  left: 0; right: 0;
  height: 1px;
  background: rgba(240,168,50,0.8);
  border-top: 1px dashed rgba(240,168,50,0.6);
}
.water-threshold-label {
  position: absolute;
  right: 8px;
  font-size: 0.6rem;
  color: var(--amber-lt);
  background: rgba(15,32,48,0.8);
  padding: 1px 4px;
  border-radius: 2px;
}
.water-pump-indicator {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 2px;
  background: rgba(0,0,0,0.5);
}
.water-pump-indicator.on { color: #6ed86e; }
.water-pump-indicator.off { color: rgba(255,255,255,0.4); }

/* ══ DECISION PANEL ══════════════════════════════════ */
.decision-panel {
  background: var(--forest);
  border-radius: var(--radius-md);
  padding: 16px;
  border: 1px solid var(--green-dk);
}
.decision-title {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: rgba(255,255,255,0.4);
  margin-bottom: 12px;
}
.decision-section { margin-bottom: 12px; }
.decision-section-label {
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: rgba(255,255,255,0.3);
  margin-bottom: 4px;
}
.decision-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.decision-key { font-size: 0.75rem; color: rgba(255,255,255,0.55); }
.decision-val { font-size: 0.75rem; font-weight: 600; color: rgba(255,255,255,0.88); }
.decision-val.warning { color: var(--amber-lt); }
.decision-val.critical { color: var(--red-lt); }
.decision-val.good { color: #6ed86e; }
.decision-divider { border: none; border-top: 1px solid rgba(255,255,255,0.08); margin: 10px 0; }
.decision-output {
  background: rgba(255,255,255,0.05);
  border-radius: var(--radius);
  padding: 10px 12px;
  border-left: 3px solid var(--green-lt);
}
.decision-output.warning-border { border-left-color: var(--amber-lt); }
.decision-output.critical-border { border-left-color: var(--red-lt); }
.decision-output-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(255,255,255,0.3); margin-bottom: 4px; }
.decision-output-text { font-size: 0.82rem; font-weight: 600; color: white; }
.decision-authority {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  font-size: 0.65rem;
  color: rgba(255,255,255,0.35);
}
.authority-badge {
  font-size: 0.6rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 2px 6px;
  border-radius: 2px;
  border: 1px solid;
}
.authority-badge.cloud { color: var(--blue-lt); border-color: rgba(74,144,208,0.4); background: rgba(74,144,208,0.1); }
.authority-badge.edge  { color: var(--amber-lt); border-color: rgba(240,168,50,0.4); background: rgba(240,168,50,0.1); }
.authority-badge.hw    { color: #c080ff; border-color: rgba(192,128,255,0.4); background: rgba(192,128,255,0.1); }

/* ══ EVENT LOG ═══════════════════════════════════════ */
.event-log {
  background: #111;
  border-radius: var(--radius-md);
  padding: 12px;
  font-family: 'Consolas', 'Courier New', monospace;
  font-size: 0.72rem;
  max-height: 180px;
  overflow-y: auto;
  border: 1px solid #222;
}
.log-entry { display: flex; gap: 10px; margin-bottom: 4px; line-height: 1.4; }
.log-time { color: #555; flex-shrink: 0; }
.log-msg { }
.log-msg.info    { color: #6ed86e; }
.log-msg.warning { color: var(--amber-lt); }
.log-msg.critical { color: var(--red-lt); }
.log-msg.system  { color: #4a90d0; }
.log-msg.muted   { color: #666; }

/* ══ SIM CONTROLS ════════════════════════════════════ */
.sim-controls {
  background: var(--white);
  border: 1px solid var(--border-lt);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  box-shadow: var(--shadow-sm);
}
.sim-controls-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}
.sim-controls-title {
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--slate);
}
.sim-controls-badge {
  font-size: 0.6rem;
  font-weight: 700;
  text-transform: uppercase;
  background: var(--blue-bg);
  color: var(--blue);
  border: 1px solid #c0d8f0;
  padding: 1px 6px;
  border-radius: 2px;
  letter-spacing: 0.06em;
}
.sim-btn-grid { display: flex; flex-wrap: wrap; gap: 8px; }

/* ══ FARM OVERVIEW ═══════════════════════════════════ */
.farm-overview {
  background: var(--forest);
  border-radius: var(--radius-md);
  padding: 14px 18px;
  color: rgba(255,255,255,0.85);
  border: 1px solid var(--green-dk);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useReducer } = React;

/* ═══════════════════════════════════════════════
   SIMULATION ENGINE
   ═══════════════════════════════════════════════ */
const INITIAL_STATE = {
  // Navigation
  page: 'dashboard',

  // Farm
  farmName: "Riya's Demonstration Farm",
  farmArea: '1.6 ha',
  crop: 'Paddy',
  mode: 'AUTO',

  // Irrigation
  waterLevel: -14.0,
  waterThreshold: -15.0,
  waterTarget: -12.0,
  soilMoisture: 34,
  pumpState: 'OFF',
  pumpEnergy: 3.8,
  irrigationPhase: 'idle',   // idle | drying | threshold-crossed | pumping | recovering | complete

  // Field zones
  fields: [
    { id: 1, name: 'Field 1', status: 'healthy', moisture: 72, area: '0.5 ha' },
    { id: 2, name: 'Field 2', status: 'healthy', moisture: 68, area: '0.6 ha' },
    { id: 3, name: 'Field 3', status: 'healthy', moisture: 38, area: '0.5 ha' },
  ],

  // Connectivity
  cloudOnline: true,
  edgeOnline: true,
  outageActive: false,
  syncPending: 0,

  // Crop health
  cropStressActive: false,
  photoRequested: false,
  vegTrend: -2,
  soilMoistureField3: 52,
  rainfall7d: 22,
  tempElevated: false,

  // Storage
  storageTemp: 7.2,
  storageHumidity: 71,
  solarAvailability: 4.8,
  batteryLevel: 78,
  storageUsed: 44,
  storageCapacity: 62,
  qualityRiskHours: 18,
  lotId: 'T-042',
  lotCrop: 'Tomatoes',
  buyerDeadline: 'Tomorrow · 10:00',

  // FPO
  activeFarmers: 238,
  totalFarmers: 250,
  expectedHarvest: 84,
  fpoStorageCapacity: 62,
  fpoStorageAvailable: 18,
  buyerDemand: 71,
  newHarvestAdded: false,

  // Event log
  events: [
    { time: '08:38', msg: 'AFRO edge controller initialized', type: 'system' },
    { time: '08:39', msg: 'Field sensors connected — all zones nominal', type: 'info' },
    { time: '08:40', msg: 'Cloud sync complete — weather data refreshed', type: 'info' },
    { time: '08:41', msg: 'Dashboard ready — monitoring active', type: 'muted' },
  ],

  // Arch panel
  archOpen: false,

  // Field inspection
  inspectionScheduled: false,
  inspectionTime: '',

  // FPO dispatch
  dispatchConfirmed: false,
  dispatchTime: '',
  showAllLots: false,
  routeOptimised: false,
};

function addEvent(state, msg, type='info') {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  const time = `${h}:${m}:${s}`;
  return { ...state, events: [{ time, msg, type }, ...state.events].slice(0, 40) };
}

function reducer(state, action) {
  switch (action.type) {

    case 'SET_PAGE':
      return { ...state, page: action.payload };

    case 'TICK_DRY': {
      if (state.irrigationPhase !== 'drying') return state;
      const newLevel = parseFloat(Math.max(state.waterLevel - 0.5, -18).toFixed(1));
      let next = { ...state, waterLevel: newLevel, soilMoisture: Math.max(18, state.soilMoisture - 2) };
      if (newLevel <= state.waterThreshold) {
        next = { ...next, irrigationPhase: 'threshold-crossed' };
        next = addEvent(next, 'Water threshold crossed: ' + newLevel.toFixed(1) + ' cm (threshold: ' + state.waterThreshold + ' cm)', 'warning');
        next = addEvent(next, 'Edge rule evaluating condition…', 'system');
      }
      return next;
    }

    case 'TRIGGER_IRRIGATION': {
      let next = { ...state, pumpState: 'ON', irrigationPhase: 'pumping' };
      next = addEvent(next, 'AFRO edge rule triggered — Irrigation required', 'warning');
      next = addEvent(next, 'Pump ON — irrigation cycle started', 'info');
      return next;
    }

    case 'TICK_PUMP': {
      if (state.irrigationPhase !== 'pumping') return state;
      const newLevel = Math.min(state.waterLevel + 0.5, state.waterTarget);
      let next = {
        ...state,
        waterLevel: parseFloat(newLevel.toFixed(1)),
        soilMoisture: Math.min(72, state.soilMoisture + 2),
        pumpEnergy: parseFloat((state.pumpEnergy + 0.08).toFixed(2)),
      };
      if (newLevel >= state.waterTarget) {
        next = { ...next, pumpState: 'OFF', irrigationPhase: 'complete' };
        next = addEvent(next, 'Target water level reached: ' + newLevel.toFixed(1) + ' cm', 'info');
        next = addEvent(next, 'Pump OFF — cycle complete', 'info');
        next = addEvent(next, 'Outcome verified — SENSE → VALIDATE → ACT ✓', 'info');
        if (!state.cloudOnline) {
          next = { ...next, syncPending: next.syncPending + 3 };
        }
      }
      return next;
    }

    case 'START_DRY': {
      if (state.irrigationPhase !== 'idle' && state.irrigationPhase !== 'complete') return state;
      let next = { ...state, irrigationPhase: 'drying', waterLevel: -14.0, soilMoisture: 34 };
      next = addEvent(next, 'Simulation: Drying scenario started', 'system');
      return next;
    }

    case 'SIMULATE_OUTAGE': {
      if (state.outageActive) return state;
      let next = { ...state, cloudOnline: false, outageActive: true, syncPending: 0 };
      next = addEvent(next, 'Internet outage simulated — cloud OFFLINE', 'critical');
      next = addEvent(next, 'Edge controller active — local rules engaged', 'warning');
      return next;
    }

    case 'RECONNECT_CLOUD': {
      if (!state.outageActive) return state;
      let next = { ...state, cloudOnline: true, outageActive: false };
      const pending = state.syncPending;
      next = addEvent(next, 'Cloud connection restored — ONLINE', 'info');
      if (pending > 0) {
        next = addEvent(next, `${pending} queued event(s) synchronized to cloud`, 'info');
      }
      next = { ...next, syncPending: 0 };
      return next;
    }

    case 'TRIGGER_CROP_STRESS': {
      let next = {
        ...state,
        cropStressActive: true,
        vegTrend: -14,
        soilMoistureField3: 21,
        rainfall7d: 18,
        tempElevated: true,
        fields: state.fields.map(f => f.id === 3
          ? { ...f, status: 'stress', moisture: 21 }
          : f
        )
      };
      next = addEvent(next, 'Crop intelligence: Potential stress detected — Field 3', 'warning');
      next = addEvent(next, 'Satellite trend: -14% vegetation index vs trajectory', 'warning');
      return next;
    }

    case 'REQUEST_PHOTO': {
      let next = { ...state, photoRequested: true };
      next = addEvent(next, 'Photo verification requested from farmer (Field 3)', 'system');
      return next;
    }

    case 'NEW_HARVEST': {
      let next = {
        ...state,
        newHarvestAdded: true,
        storageUsed: Math.min(state.storageCapacity, state.storageUsed + 6),
        fpoStorageAvailable: Math.max(0, state.fpoStorageAvailable - 6),
        expectedHarvest: state.expectedHarvest + 5,
      };
      next = addEvent(next, 'New harvest lot recorded — 6t Tomatoes (T-043)', 'info');
      return next;
    }

    case 'INCREASE_SOLAR': {
      let next = { ...state, solarAvailability: Math.min(8.5, state.solarAvailability + 1.5), batteryLevel: Math.min(98, state.batteryLevel + 8) };
      next = addEvent(next, 'Solar availability increased — pre-cooling recommended', 'info');
      return next;
    }

    case 'RESET': {
      const reset = {
        ...INITIAL_STATE,
        inspectionScheduled: false,
        inspectionTime: '',
        dispatchConfirmed: false,
        dispatchTime: '',
        showAllLots: false,
        routeOptimised: false,
        events: [
          { time: new Date().toLocaleTimeString('en-IN', {hour:'2-digit',minute:'2-digit'}), msg: 'Scenario reset — all systems nominal', type: 'system' },
          ...INITIAL_STATE.events
        ]
      };
      return reset;
    }

    case 'SCHEDULE_INSPECTION': {
      const now = new Date();
      const next = new Date(now.getTime() + 2 * 60 * 60 * 1000); // +2 hours
      const timeStr = next.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
      const dateStr = 'Today · ' + timeStr;
      let s = { ...state, inspectionScheduled: true, inspectionTime: dateStr };
      s = addEvent(s, 'Field inspection scheduled — Field 3 · ' + dateStr, 'info');
      return s;
    }

    case 'CONFIRM_DISPATCH': {
      if (state.dispatchConfirmed) return state;
      const now = new Date();
      const ts = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      let s = { ...state, dispatchConfirmed: true, dispatchTime: ts };
      s = addEvent(s, 'Dispatch confirmed — Lot T-042 · 5.5 t Tomatoes → Buyer Hub A', 'info');
      s = addEvent(s, 'Vehicle dispatch scheduled · ETA: Tomorrow 10:00', 'info');
      return s;
    }

    case 'TOGGLE_ALL_LOTS':
      return { ...state, showAllLots: !state.showAllLots };

    case 'OPTIMISE_ROUTE':
      if (state.routeOptimised) return state;
      // eslint-disable-next-line no-case-declarations
      let rs = { ...state, routeOptimised: true };
      rs = addEvent(rs, 'Route optimised — 3 stops · 42 km · ETA 10:00 at Buyer Hub A', 'info');
      return rs;

    case 'TOGGLE_ARCH':
      return { ...state, archOpen: !state.archOpen };

    default:
      return state;
  }
}

function MetricCard({ label, value, unit, sub, variant, className='' }) {
  return (
    <div className={`metric-card ${variant||''} ${className}`}>
      <div className="metric-label">{label}</div>
      <div className={`metric-value ${variant==='warning'?'amber':variant==='critical'?'red':variant==='active'?'green':variant==='info'?'blue':''}`}>
        {value}<span style={{fontSize:'0.7em',fontWeight:400,marginLeft:2}}>{unit}</span>
      </div>
      {sub && <div className="metric-sub">{sub}</div>}
    </div>
  );
}

function StatusBadge({ status, label, pulsing }) {
  const map = { online:'green', offline:'red', active:'amber', warning:'amber', normal:'green', stress:'red', healthy:'green', critical:'red' };
  const variant = map[status] || 'grey';
  return (
    <span className={`badge ${variant} ${pulsing?'pulsing':''}`}>
      <span>●</span> {label || status}
    </span>
  );
}

function EventLog({ events }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current) ref.current.scrollTop = 0;
  }, [events.length]);
  return (
    <div className="event-log" ref={ref}>
      {events.map((e, i) => (
        <div key={i} className="log-entry">
          <span className="log-time">{e.time}</span>
          <span className={`log-msg ${e.type}`}>{e.msg}</span>
        </div>
      ))}
    </div>
  );
}

function ProgressBar({ value, max=100, variant }) {
  const pct = Math.round(Math.min(100, Math.max(0, (value/max)*100)));
  const cls = pct > 80 ? 'red' : pct > 60 ? 'amber' : variant || '';
  return (
    <div className="progress-bar">
      <div className={`progress-fill ${cls}`} style={{width: pct+'%'}} />
    </div>
  );
}

   ═══════════════════════════════════════════════ */
function WaterLevelViz({ waterLevel, threshold, pumpState }) {
  // map -20..0 to 0..100%
  const toHeight = (v) => Math.max(5, Math.min(95, ((v + 20) / 20) * 100));
  const fillH = toHeight(waterLevel);
  const thresholdH = toHeight(threshold);

  return (
    <div>
      <div className="water-level-viz">
        <div className="water-fill" style={{ height: fillH + '%' }}>
          <div className="water-surface" />
        </div>
        <div
          className="water-threshold-line"
          style={{ bottom: thresholdH + '%' }}
        >
          <span className="water-threshold-label" style={{bottom: '2px'}}>Threshold {threshold} cm</span>
        </div>
        <div className="water-label-overlay">
          <div className="water-level-value">{waterLevel.toFixed(1)}</div>
          <div className="water-level-unit">cm (water table)</div>
        </div>
        <div className={`water-pump-indicator ${pumpState==='ON'?'on':'off'}`}>
          {pumpState==='ON' ? <span className="spinning">⚙</span> : '⚙'} Pump {pumpState}

      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════
   DECISION PANEL
   ═══════════════════════════════════════════════ */
function DecisionPanel({ state }) {
  const { waterLevel, waterThreshold, pumpState, irrigationPhase, cloudOnline, edgeOnline } = state;

  const getDecision = () => {
    if (irrigationPhase === 'drying' && waterLevel > waterThreshold)
      return { text: 'Monitoring — wait for threshold', border: '', output: 'Monitor' };
    if (irrigationPhase === 'threshold-crossed')
      return { text: 'Irrigation required', border: 'warning-border', output: 'Irrigation Required' };
    if (irrigationPhase === 'pumping')
      return { text: 'Irrigation in progress — pump active', border: 'warning-border', output: 'Pump ON' };
    if (irrigationPhase === 'complete')
      return { text: 'Irrigation cycle complete — outcome verified', border: '', output: 'Verified ✓' };
    return { text: 'Wait — conditions within range', border: '', output: 'No Action Required' };
  };

  const decision = getDecision();
  const authority = cloudOnline ? 'CLOUD + EDGE' : 'LOCAL EDGE';

  return (
    <div className="decision-panel">
      <div className="decision-title">AFRO Decision Engine</div>

      <div className="decision-section">
        <div className="decision-section-label">Current Condition</div>
        <div className="decision-row">
          <span className="decision-key">Water level</span>
          <span className={`decision-val ${waterLevel <= waterThreshold ? 'critical' : ''}`}>{waterLevel.toFixed(1)} cm</span>
        </div>
        <div className="decision-row">
          <span className="decision-key">Threshold</span>
          <span className="decision-val">{waterThreshold} cm</span>
        </div>
        <div className="decision-row">
          <span className="decision-key">Pump</span>
          <span className={`decision-val ${pumpState==='ON'?'good':''}`}>{pumpState}</span>
        </div>
      </div>

      <hr className="decision-divider" />

      <div className={`decision-output ${decision.border}`}>
        <div className="decision-output-label">Decision</div>
        <div className="decision-output-text">{decision.output}</div>
      </div>

      <hr className="decision-divider" />

      <div className="decision-section">
        <div className="decision-section-label">Safety</div>
        <div className="decision-row">
          <span className="decision-key">Hardware</span>
          <span className="decision-val good">Protected</span>
        </div>
        <div className="decision-row">
          <span className="decision-key">Sensors</span>
          <span className="decision-val good">Active</span>
        </div>
      </div>

      <div className="decision-authority">
        <span>Authority:</span>
        {cloudOnline
          ? <span className="authority-badge cloud">Cloud</span>
          : null}
        <span className="authority-badge edge">Edge</span>
        <span className="authority-badge hw">HW Protect</span>
      </div>
    </div>
  );
}

function AlertsPage({ state, dispatch }) {
  const {
    cropStressActive, cloudOnline, outageActive, irrigationPhase,
    waterLevel, waterThreshold, pumpState, soilMoisture,
    storageTemp, qualityRiskHours, solarAvailability,
    photoRequested, vegTrend, events
  } = state;

  // Build alerts list dynamically from existing simulation state
  const alerts = [];

  if (!cloudOnline) {
    alerts.push({
      id: 'cloud-offline',
      severity: 'critical',
      icon: '🔴',
      title: 'Cloud connection unavailable',
      detail: 'Local edge control is active. All irrigation decisions are running on onboard rules. Events will sync when connection is restored.',
      time: 'Now',
      module: 'AFRO Field',
      action: () => dispatch({ type: 'RECONNECT_CLOUD' }),
      actionLabel: '☁ Reconnect Cloud',
      actionDisabled: false,
    });
  }

  if (irrigationPhase === 'threshold-crossed' || irrigationPhase === 'pumping') {
    alerts.push({
      id: 'irrigation-active',
      severity: irrigationPhase === 'pumping' ? 'info' : 'warning',
      icon: irrigationPhase === 'pumping' ? '⚙' : '⚠',
      title: irrigationPhase === 'pumping' ? 'Irrigation cycle in progress' : 'Irrigation threshold crossed — pump starting',
      detail: `Water level: ${waterLevel.toFixed(1)} cm · Threshold: ${waterThreshold} cm · Pump: ${pumpState}`,
      time: 'Active',
      module: 'AFRO Field',
      action: () => dispatch({ type: 'SET_PAGE', payload: 'dashboard' }),
      actionLabel: 'View Dashboard',
      actionDisabled: false,
    });
  }

  if (irrigationPhase === 'complete') {
    alerts.push({
      id: 'irrigation-done',
      severity: 'success',
      icon: '✓',
      title: 'Irrigation cycle complete — outcome verified',
      detail: `Pump OFF · Water level restored to ${waterLevel.toFixed(1)} cm · Soil moisture: ${soilMoisture}%`,
      time: 'Recent',
      module: 'AFRO Field',
      action: () => dispatch({ type: 'SET_PAGE', payload: 'dashboard' }),
      actionLabel: 'View Dashboard',
      actionDisabled: false,
    });
  }

  if (cropStressActive) {
    alerts.push({
      id: 'crop-stress',
      severity: 'warning',
      icon: '🌿',
      title: 'Potential crop stress detected — Field 3',
      detail: `Vegetation index trend: ${vegTrend}% vs expected trajectory · Soil moisture low · Temperature elevated. Field verification required before action.`,
      time: 'Active',
      module: 'AFRO Intelligence',
      action: () => dispatch({ type: 'SET_PAGE', payload: 'crophealth' }),
      actionLabel: 'View Crop Health',
      actionDisabled: false,
    });
    if (!photoRequested) {
      alerts.push({
        id: 'photo-pending',
        severity: 'warning',
        icon: '📷',
        title: 'Field photo verification not yet requested',
        detail: 'AFRO has detected a crop stress signal on Field 3. Request a photo from the farmer to confirm before any intervention.',
        time: 'Pending',
        module: 'AFRO Intelligence',
        action: () => { dispatch({ type: 'REQUEST_PHOTO' }); dispatch({ type: 'SET_PAGE', payload: 'crophealth' }); },
        actionLabel: 'Request Photo',
        actionDisabled: false,
      });
    } else {
      alerts.push({
        id: 'photo-requested',
        severity: 'info',
        icon: '📷',
        title: 'Farmer photo verification requested — awaiting response',
        detail: 'Photo request sent for Field 3. Awaiting field verification before agronomic decision.',
        time: 'Awaiting',
        module: 'AFRO Intelligence',
        action: null,
        actionLabel: null,
        actionDisabled: true,
      });
    }
  }

  if (qualityRiskHours <= 20) {
    alerts.push({
      id: 'quality-risk',
      severity: 'warning',
      icon: '📦',
      title: `Quality risk window: ${qualityRiskHours} hours remaining — Lot T-042`,
      detail: `Storage temperature: ${storageTemp.toFixed(1)}°C · Buyer deadline: Tomorrow 10:00 · Dispatch recommended via FEFO.`,
      time: 'Active',
      module: 'AFRO Store',
      action: () => dispatch({ type: 'SET_PAGE', payload: 'store' }),
      actionLabel: 'View Store',
      actionDisabled: false,
    });
  }

  if (solarAvailability >= 6) {
    alerts.push({
      id: 'solar-opportunity',
      severity: 'info',
      icon: '☀',
      title: 'High solar availability — pre-cooling opportunity',
      detail: `Solar output: ${solarAvailability.toFixed(1)} kW · Recommended: run pre-cooling cycle now to reduce grid cost.`,
      time: 'Now',
      module: 'AFRO Store',
      action: () => dispatch({ type: 'SET_PAGE', payload: 'store' }),
      actionLabel: 'View Store',
      actionDisabled: false,
    });
  }

  if (soilMoisture < 28 && irrigationPhase === 'idle') {
    alerts.push({
      id: 'low-moisture',
      severity: 'warning',
      icon: '💧',
      title: 'Soil moisture below recommended level',
      detail: `Current: ${soilMoisture}% · Recommended minimum: 30% for tillering stage · Consider initiating irrigation.`,
      time: 'Active',
      module: 'AFRO Field',
      action: () => dispatch({ type: 'SET_PAGE', payload: 'dashboard' }),
      actionLabel: 'View Dashboard',
      actionDisabled: false,
    });
  }

  // Always-present informational alerts
  alerts.push({
    id: 'edge-nominal',
    severity: 'success',
    icon: '⚡',
    title: 'Edge controller operating normally',
    detail: 'All local rules active · Sensor polling interval: 60s · Last heartbeat: just now.',
    time: 'Nominal',
    module: 'System',
    action: null,
    actionLabel: null,
    actionDisabled: true,
  });

  const severityOrder = { critical: 0, warning: 1, info: 2, success: 3 };
  alerts.sort((a, b) => (severityOrder[a.severity] ?? 9) - (severityOrder[b.severity] ?? 9));

  const severityStyle = {
    critical: { border: 'var(--red)',   bg: 'var(--red-bg)',   label: 'Critical', badgeClass: 'red'   },
    warning:  { border: 'var(--amber)', bg: 'var(--amber-bg)', label: 'Warning',  badgeClass: 'amber' },
    info:     { border: 'var(--blue)',  bg: 'var(--blue-bg)',  label: 'Info',     badgeClass: 'blue'  },
    success:  { border: 'var(--green-lt)', bg: '#f0f8f0',      label: 'OK',       badgeClass: 'green' },
  };

  const activeCount = alerts.filter(a => a.severity === 'critical' || a.severity === 'warning').length;

  return (
    <div className="page">
      <div className="page-header">
        <div className="page-header-row">
          <div>
            <div className="page-title">Alerts & Notifications</div>
            <div className="page-subtitle">Live system signals · Action items · Event history</div>
          </div>
          <div className="flex-row gap-8">
            {activeCount > 0
              ? <StatusBadge status="warning" label={`${activeCount} active alert${activeCount > 1 ? 's' : ''}`} pulsing />
              : <StatusBadge status="normal" label="All clear" />
            }
            <button className="btn btn-ghost btn-sm" onClick={() => dispatch({ type: 'SET_PAGE', payload: 'dashboard' })}>
              ← Dashboard
            </button>
          </div>
        </div>
      </div>

      {/* Summary strip */}
      <div className="mb-16">
        <div className="metrics-grid" style={{gridTemplateColumns:'repeat(4,1fr)'}}>
          <MetricCard label="Critical" value={alerts.filter(a=>a.severity==='critical').length} sub="Immediate action" variant={alerts.filter(a=>a.severity==='critical').length > 0 ? 'critical' : ''} />
          <MetricCard label="Warnings" value={alerts.filter(a=>a.severity==='warning').length} sub="Monitor closely" variant={alerts.filter(a=>a.severity==='warning').length > 0 ? 'warning' : ''} />
          <MetricCard label="Info" value={alerts.filter(a=>a.severity==='info').length} sub="Opportunities" variant="info" />
          <MetricCard label="Nominal" value={alerts.filter(a=>a.severity==='success').length} sub="Operating normally" variant="" />
        </div>
      </div>

      {/* Alert list */}
      <div className="mb-16">
        <div className="section-title">Active Alerts & Signals</div>
        <div className="flex-col" style={{gap:10}}>
          {alerts.map(alert => {
            const s = severityStyle[alert.severity] || severityStyle.info;
            return (
              <div
                key={alert.id}
                style={{
                  background: s.bg,
                  border: `1px solid`,
                  borderColor: s.border,
                  borderLeft: `4px solid ${s.border}`,
                  borderRadius: 'var(--radius-md)',
                  padding: '14px 16px',
                  display: 'flex',
                  alignItems: 'flex-start',
                  gap: 14,
                }}
                className="fade-in"
              >
                <span style={{fontSize:'1.3rem', flexShrink:0, marginTop:1}}>{alert.icon}</span>
                <div style={{flex:1, minWidth:0}}>
                  <div className="flex-between" style={{marginBottom:4, flexWrap:'wrap', gap:6}}>
                    <span style={{fontWeight:700, fontSize:'0.85rem', color:'var(--charcoal)'}}>{alert.title}</span>
                    <div className="flex-row gap-4">
                      <span className={`badge ${s.badgeClass}`}>{s.label}</span>
                      <span className="badge grey">{alert.module}</span>
                      <span style={{fontSize:'0.65rem', color:'var(--muted)'}}>{alert.time}</span>
                    </div>
                  </div>
                  <div style={{fontSize:'0.75rem', color:'var(--slate)', lineHeight:1.6, marginBottom: alert.action ? 10 : 0}}>
                    {alert.detail}
                  </div>
                  {alert.action && !alert.actionDisabled && (
                    <button className="btn btn-secondary btn-xs" onClick={alert.action}>
                      {alert.actionLabel}
                    </button>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Recent event log */}
      <div className="mb-16">
        <div className="section-title flex-between">
          <span>Recent Event Log</span>
          <span className="text-xs text-muted font-mono">{events.length} entries</span>
        </div>
        <EventLog events={events} />
      </div>

      {/* Simulation nudge */}
      <div style={{background:'var(--off-white)',border:'1px solid var(--border-lt)',borderRadius:'var(--radius-md)',padding:'12px 16px'}}>
        <div style={{fontSize:'0.72rem',color:'var(--muted)',marginBottom:8}}>
          <strong style={{color:'var(--slate)'}}>Simulate conditions</strong> to see alerts populate in real time:
        </div>
        <SimControls state={state} dispatch={dispatch} />
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════
   MAIN APP
   ═══════════════════════════════════════════════ */
function App() {
  const [state, dispatch] = useReducer(reducer, INITIAL_STATE);
  const intervalRef = useRef(null);

  // Simulation tick
  useEffect(() => {
    if (intervalRef.current) clearInterval(intervalRef.current);

    if (state.irrigationPhase === 'drying') {
      intervalRef.current = setInterval(() => {
        dispatch({ type: 'TICK_DRY' });
      }, 900);
    } else if (state.irrigationPhase === 'threshold-crossed') {
      // auto-trigger irrigation after a brief pause
      const t = setTimeout(() => dispatch({ type: 'TRIGGER_IRRIGATION' }), 1200);
      return () => clearTimeout(t);
    } else if (state.irrigationPhase === 'pumping') {
      intervalRef.current = setInterval(() => {
        dispatch({ type: 'TICK_PUMP' });
      }, 700);
    }

    return () => { if (intervalRef.current) clearInterval(intervalRef.current); };
  }, [state.irrigationPhase]);

  const navItems = [
    { id: 'dashboard',   icon: '⊞', label: 'Dashboard',    badge: state.irrigationPhase === 'threshold-crossed' || (!state.cloudOnline) ? '!' : null },
    { id: 'crophealth',  icon: '🌿', label: 'Crop Health',  badge: state.cropStressActive ? '!' : null },
    { id: 'store',       icon: '📦', label: 'Store',        badge: null },
    { id: 'fpo',         icon: '🤝', label: 'FPO Network',  badge: null },
  ];

  const renderPage = () => {
    switch (state.page) {
      case 'dashboard':  return <DashboardPage state={state} dispatch={dispatch} />;
      case 'crophealth': return <CropHealthPage state={state} dispatch={dispatch} />;
      case 'store':      return <StorePage state={state} dispatch={dispatch} />;
      case 'fpo':        return <FPOPage state={state} dispatch={dispatch} />;
      case 'farm':       return <FarmProfilePage state={state} dispatch={dispatch} />;
      case 'alerts':     return <AlertsPage state={state} dispatch={dispatch} />;
      default:           return <DashboardPage state={state} dispatch={dispatch} />;
    }
  };

  return (
    <div className="app-shell">
      {/* Header */}
      <header className="app-header">
        <div className="header-brand">
          <span className="header-logo">AFRO Stack</span>
          <span className="header-tagline">Agentic Farm-Gate Resource Orchestrator</span>
        </div>
        <div className="header-right">
          <div className="header-connectivity">
            <span className={`conn-badge ${state.cloudOnline ? 'online' : 'offline'}`}>
              ☁ Cloud {state.cloudOnline ? 'Online' : 'Offline'}
            </span>
            <span className={`conn-badge ${state.outageActive ? 'active' : 'online'}`}>
              ⚡ Edge {state.outageActive ? 'Active' : 'Online'}
            </span>
            {state.syncPending > 0 && (
              <span className="conn-badge active">{state.syncPending} queued</span>
            )}
          </div>
          <div className="system-status">
            <span className={`status-dot ${state.cloudOnline ? '' : 'warning'}`} />
            <span className="status-label">System {state.cloudOnline ? 'Online' : 'Degraded'}</span>
          </div>
        </div>
      </header>

      {/* Offline banner */}
      <OfflineBanner state={state} />

      {/* Body */}
      <div className="app-body">
        {/* Sidebar */}
        <nav className="sidebar">
          <div className="sidebar-section-label">Modules</div>
          {navItems.map(item => (
            <button
              key={item.id}
              className={`nav-item ${state.page === item.id ? 'active' : ''}`}
              onClick={() => dispatch({ type: 'SET_PAGE', payload: item.id })}
            >
              <span className="nav-icon">{item.icon}</span>
              <span>{item.label}</span>
              {item.badge && <span className="nav-badge">{item.badge}</span>}
            </button>
          ))}
          <hr className="sidebar-divider" />
          <div className="sidebar-section-label">Farm</div>
          <button
            className={`nav-item ${state.page === 'farm' ? 'active' : ''}`}
            onClick={() => dispatch({ type: 'SET_PAGE', payload: 'farm' })}
          >
            <span className="nav-icon">👤</span>
            <span>Riya's Farm</span>
          </button>
          <button
            className={`nav-item ${state.page === 'alerts' ? 'active' : ''}`}
            onClick={() => dispatch({ type: 'SET_PAGE', payload: 'alerts' })}
          >
            <span className="nav-icon">🔔</span>
            <span>Alerts</span>
            {(state.cropStressActive || !state.cloudOnline) && <span className="nav-badge">!</span>}
          </button>
          <div className="sidebar-footer">
            <div>AFRO Stack v0.9</div>
            <div>Hackathon Prototype</div>
            <div style={{marginTop:4,color:'rgba(255,255,255,0.15)'}}>Schneider Electric · SE Challenge</div>
          </div>
        </nav>

        {/* Main */}
        <main className="main-content">
          {renderPage()}
        </main>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
